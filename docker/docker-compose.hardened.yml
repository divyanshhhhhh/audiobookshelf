# Hardened runtime configuration for Audiobookshelf.
#
# Changes from the previous version:
#   - removed the obsolete `version:` key (Compose v2 warns on it)
#   - pinned the image tag instead of tracking :latest, per MAINTENANCE.md s2
#   - added `user: "1000:1000"` so the container does not run as root, which is
#     what scripts/post-deploy-validate.sh check 5 actually asserts
#   - dropped cap_add entirely; those capabilities were only needed for a
#     root process dropping privileges at startup

networks:
  abs-internal:
    driver: bridge
    internal: false   # Caddy needs egress for ACME; the app stays unpublished

services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.35.1
    container_name: abs-hardened
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production        # debug mode disabled
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/ubuntu/abs-hardened-data/config:/config
      - /home/ubuntu/abs-hardened-data/metadata:/metadata
      - /home/ubuntu/abs-hardened-data/audiobooks:/audiobooks:ro
      - /home/ubuntu/abs-hardened-data/podcasts:/podcasts:ro
    # No direct host port publish; reachable only through the Caddy proxy.
    expose:
      - "80"
    networks:
      - abs-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false   # app writes to /config and /metadata
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  caddy:
    image: caddy:2-alpine
    container_name: abs-caddy
    restart: unless-stopped
    ports:
      - "13380:80"
      - "13443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - abs-internal
    depends_on:
      audiobookshelf:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
