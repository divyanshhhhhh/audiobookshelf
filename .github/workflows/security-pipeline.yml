name: DevSecOps Security Pipeline

# Triggers target `master` because that is this repository's default branch.
# The previous version targeted `main`, which does not exist here, so the
# pull_request trigger never fired and PRs received no security status checks.
on:
  push:
    branches: [ master, security/devsecops-pipeline, security/pipeline-fixes ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write   # required to publish Semgrep SARIF to code scanning

env:
  IMAGE_NAME: audiobookshelf-hardened
  IMAGE_TAG: ci-${{ github.run_number }}
  ZAP_NETWORK: abs-ci-net
  APP_CONTAINER: abs-ci-test
  # The security tests get their own container, port and network so they never
  # touch the hardened deployment or the lab evidence containers on this host.
  SECTEST_NETWORK: abs-sectest-net
  SECTEST_CONTAINER: abs-sectest

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static Application Security Testing
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static Code Analysis (SAST)
    runs-on: self-hosted
    outputs:
      semgrep_findings: ${{ steps.summarize.outputs.semgrep_findings }}
      eslint_findings: ${{ steps.summarize.outputs.eslint_findings }}
      gitleaks_findings: ${{ steps.summarize.outputs.gitleaks_findings }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Semgrep runs from a throwaway virtualenv so the runner's system Python
      # is never modified. The venv is removed at the end of the step.
      - name: Semgrep (SAST)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m venv .semgrep-venv
          ./.semgrep-venv/bin/pip install --quiet --upgrade pip
          ./.semgrep-venv/bin/pip install --quiet semgrep
          ./.semgrep-venv/bin/semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/nodejs \
            --exclude node_modules \
            --exclude client/dist \
            --exclude dist \
            --exclude build \
            --exclude coverage \
            --exclude .git \
            --max-target-bytes 1000000 \
            --sarif \
            --output semgrep-results.sarif \
            --error || SEMGREP_EXIT=$?
          rm -rf .semgrep-venv
          # semgrep --error exits 1 when findings exist. That is expected here;
          # the notify job decides what to do about findings. Any other non-zero
          # exit is a genuine tool failure and must fail the step.
          if [ "${SEMGREP_EXIT:-0}" -gt 1 ]; then
            echo "::error::Semgrep failed to run (exit ${SEMGREP_EXIT})"
            exit 1
          fi
          test -s semgrep-results.sarif

      # The repository has no ESLint dependency of its own, so versions are
      # pinned here. eslint 9 removed --no-eslintrc and --ext, which is why the
      # previous inline-config version of this step silently produced no output.
      # The config extends `plugin:security/recommended-legacy`, not
      # `plugin:security/recommended`. Even in eslint-plugin-security 2.1.1 the
      # `recommended` export is flat-config shaped (`plugins` is an object), so
      # eslintrc rejects it and eslint crashes with exit 2 while formatting the
      # validation error. `recommended-legacy` is the eslintrc-compatible export.
      - name: ESLint with security plugin
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund \
            eslint@8.57.0 eslint-plugin-security@2.1.1
          npx eslint index.js server \
            --no-eslintrc \
            --config .eslintrc.security.json \
            --ext .js \
            -f json -o eslint-security.json || ESLINT_EXIT=$?
          # eslint exits 1 when it reports problems, 2 on a config/crash error.
          if [ "${ESLINT_EXIT:-0}" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit ${ESLINT_EXIT})"
            exit 1
          fi
          # Guard against the previous silent-failure mode.
          test -s eslint-security.json

      - name: Install Gitleaks (if missing)
        run: |
          set -euo pipefail
          if ! command -v gitleaks &> /dev/null; then
            wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
            tar -xzf gitleaks_8.18.1_linux_x64.tar.gz gitleaks
            sudo mv gitleaks /usr/local/bin/
            sudo chmod +x /usr/local/bin/gitleaks
            rm -f gitleaks_8.18.1_linux_x64.tar.gz
          fi
          gitleaks version

      - name: Gitleaks secrets scan
        run: |
          set -euo pipefail
          gitleaks detect --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0
          test -f gitleaks-report.json

      - name: Summarize SAST findings
        id: summarize
        run: |
          set -euo pipefail
          SEMGREP=$(jq '.runs[0].results | length' semgrep-results.sarif)
          ESLINT=$(jq '[.[].messages[]] | length' eslint-security.json)
          GITLEAKS=$(jq 'length' gitleaks-report.json)

          echo "semgrep_findings=$SEMGREP"   >> "$GITHUB_OUTPUT"
          echo "eslint_findings=$ESLINT"     >> "$GITHUB_OUTPUT"
          echo "gitleaks_findings=$GITLEAKS" >> "$GITHUB_OUTPUT"

          {
            echo "### Static analysis"
            echo ""
            echo "| Tool | Findings |"
            echo "|---|---:|"
            echo "| Semgrep | $SEMGREP |"
            echo "| ESLint (security plugin) | $ESLINT |"
            echo "| Gitleaks | $GITLEAKS |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publishing the SARIF to code scanning gives two things the artifact
      # cannot: inline annotations on the changed lines of a pull request, and
      # GitHub's own comparison of which alerts are new in this branch versus
      # already present on the base branch. Code scanning is free on public
      # repositories.
      - name: Upload Semgrep SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            semgrep-results.sarif
            eslint-security.json
            gitleaks-report.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Software Composition Analysis and container image scanning
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Open Source Dependency & Image Scanning (SCA)
    runs-on: self-hosted
    needs: static-analysis
    outputs:
      npm_critical: ${{ steps.summarize.outputs.npm_critical }}
      npm_high: ${{ steps.summarize.outputs.npm_high }}
      image_highcrit: ${{ steps.summarize.outputs.image_highcrit }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: npm audit
        run: |
          set -uo pipefail
          # npm audit exits non-zero when vulnerabilities exist; the report is
          # still written, so only a missing/empty report is a real failure.
          npm audit --omit=dev --json > npm-audit.json || true
          test -s npm-audit.json

      - name: Install Trivy (if missing)
        run: |
          set -euo pipefail
          if ! command -v trivy &> /dev/null; then
            # Pinned to a release that still publishes .deb assets. v0.49.1 was
            # previously pinned here but its Debian packages are no longer
            # downloadable, so this step returned 404 and failed the SCA job.
            wget -q https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.deb
            sudo dpkg -i trivy_0.73.0_Linux-64bit.deb
            rm -f trivy_0.73.0_Linux-64bit.deb
          fi
          trivy --version

      - name: Trivy filesystem scan
        run: |
          set -euo pipefail
          trivy fs --scanners vuln,secret,misconfig \
            --format json --output trivy-fs.json --exit-code 0 .
          test -s trivy-fs.json

      # Builds from the unmodified upstream Dockerfile. The previous branch
      # rewrote it in a way that omitted index.js, so the image built but the
      # container exited immediately and every downstream DAST result was void.
      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg TARGETPLATFORM=linux/amd64 \
            -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Smoke test the built image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node "$IMAGE_NAME:$IMAGE_TAG" \
            -e "require('fs').accessSync('/app/index.js'); console.log('index.js present')"

      - name: Trivy image scan
        run: |
          set -euo pipefail
          trivy image --severity HIGH,CRITICAL \
            --format json --output trivy-image.json --exit-code 0 \
            "$IMAGE_NAME:$IMAGE_TAG"
          test -s trivy-image.json

      - name: Summarize SCA findings
        id: summarize
        run: |
          set -euo pipefail
          NPM_CRIT=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          NPM_HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)
          IMG=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image.json)

          echo "npm_critical=$NPM_CRIT"  >> "$GITHUB_OUTPUT"
          echo "npm_high=$NPM_HIGH"      >> "$GITHUB_OUTPUT"
          echo "image_highcrit=$IMG"     >> "$GITHUB_OUTPUT"

          {
            echo "### Dependency & image scanning"
            echo ""
            echo "| Scanner | Findings |"
            echo "|---|---:|"
            echo "| npm audit (critical) | $NPM_CRIT |"
            echo "| npm audit (high) | $NPM_HIGH |"
            echo "| Trivy image (HIGH+CRITICAL) | $IMG |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            npm-audit.json
            trivy-fs.json
            trivy-image.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Dynamic and API security testing
  # ---------------------------------------------------------------------------
  # No continue-on-error. A DAST job that cannot reach its target must fail,
  # otherwise a green tick is reported for a scan that tested nothing.
  dast-api-tests:
    name: Dynamic/API Security Testing (DAST)
    runs-on: self-hosted
    needs: dependency-scan
    outputs:
      zap_alerts: ${{ steps.summarize.outputs.zap_alerts }}
    steps:
      - uses: actions/checkout@v4

      - name: Create scan network
        run: docker network create "$ZAP_NETWORK" || true

      # Waits for a real 200 from /healthcheck rather than a blind sleep, and
      # dumps container logs then fails if the app never comes up.
      - name: Start application under test
        run: |
          set -euo pipefail
          docker rm -f "$APP_CONTAINER" || true
          docker run -d --name "$APP_CONTAINER" \
            --network "$ZAP_NETWORK" \
            -p 18080:80 \
            "$IMAGE_NAME:$IMAGE_TAG"

          echo "Waiting for application to become healthy..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:18080/healthcheck > /dev/null 2>&1; then
              echo "Application responded on attempt $i"
              exit 0
            fi
            sleep 2
          done

          echo "::error::Application did not become healthy within 90s"
          docker logs "$APP_CONTAINER" || true
          exit 1

      # ZAP runs inside a container, so `localhost` there is ZAP itself, not the
      # runner. Both containers now share $ZAP_NETWORK and ZAP targets the app
      # by container name. The report is written to a mounted volume so it can
      # be uploaded as evidence.
      - name: OWASP ZAP baseline scan
        run: |
          set -uo pipefail
          mkdir -p zap-out
          chmod 777 zap-out
          docker run --rm \
            --network "$ZAP_NETWORK" \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            -u root \
            zaproxy/zap-stable:latest \
            zap-baseline.py \
              -t "http://${APP_CONTAINER}:80" \
              -r zap-baseline-report.html \
              -J zap-baseline-report.json \
              -a -m 3 -T 5 || ZAP_EXIT=$?
          echo "zap-baseline.py exit code: ${ZAP_EXIT:-0}"
          # 0 = no alerts, 2 = warnings present (normal). 1 and 3 are failures.
          if [ "${ZAP_EXIT:-0}" = "1" ] || [ "${ZAP_EXIT:-0}" = "3" ]; then
            echo "::error::ZAP failed to complete the scan"
            exit 1
          fi

      - name: Verify ZAP produced a report
        run: |
          set -euo pipefail
          ls -la zap-out
          test -s zap-out/zap-baseline-report.json
          test -s zap-out/zap-baseline-report.html

      - name: Summarize ZAP findings
        id: summarize
        run: |
          set -euo pipefail
          ALERTS=$(jq '[.site[]?.alerts[]?] | length' zap-out/zap-baseline-report.json)
          echo "zap_alerts=$ALERTS" >> "$GITHUB_OUTPUT"
          {
            echo "### DAST (OWASP ZAP baseline)"
            echo ""
            echo "Alerts raised: **$ALERTS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: zap-out/
          if-no-files-found: error

      - name: Tear down test instance
        if: always()
        run: |
          docker rm -f "$APP_CONTAINER" || true
          docker network rm "$ZAP_NETWORK" || true

  # ---------------------------------------------------------------------------
  # 4. Application-specific security regression tests
  # ---------------------------------------------------------------------------
  # ZAP's baseline scan is generic: it finds missing headers and similar classes
  # of issue, but it cannot know that this application's media-progress endpoint
  # skips a library authorization check. These tests encode the findings the
  # group produced in Labs 2 to 5 so that each one is re-checked on every commit.
  #
  # Several of the tested vulnerabilities are unpatched, so their tests fail.
  # Those failures are recorded in security-tests-baseline.json and are reported
  # rather than hidden: counts appear in the step summary, in the uploaded
  # artifact and in the notification issue. The job fails on a regression (a
  # failure not in the baseline) or on an error (the harness could not run).
  # See SECURITY_TEST_CASES.md for the justification behind each test.
  security-tests:
    name: Application Security Test Cases
    runs-on: self-hosted
    needs: dependency-scan
    outputs:
      security_test_failures: ${{ steps.summarize.outputs.security_test_failures }}
      security_test_regressions: ${{ steps.summarize.outputs.security_test_regressions }}
    steps:
      - uses: actions/checkout@v4

      - name: Create test network
        run: docker network create "$SECTEST_NETWORK" || true

      # The rate limiter's window and threshold are tuned down through the
      # environment variables the application already supports, so ST-01 runs in
      # seconds instead of grinding through 40 attempts over ten minutes. This
      # changes the limiter's configuration, never its logic: the code path
      # under test is identical to production.
      - name: Start ephemeral test instance
        run: |
          set -euo pipefail
          docker rm -f "$SECTEST_CONTAINER" || true
          docker run -d --name "$SECTEST_CONTAINER" \
            --network "$SECTEST_NETWORK" \
            -p 18081:80 \
            -e RATE_LIMIT_AUTH_MAX=5 \
            -e RATE_LIMIT_AUTH_WINDOW=60000 \
            "$IMAGE_NAME:$IMAGE_TAG"

          echo "Waiting for the test instance to become healthy..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:18081/healthcheck > /dev/null 2>&1; then
              echo "Test instance responded on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Test instance did not become healthy within 90s"
          docker logs "$SECTEST_CONTAINER" || true
          exit 1

      # SECTEST_CONTAINER comes from the workflow-level env block; the script
      # uses it to reach the target's bundled ffmpeg when building fixtures.
      - name: Run security test cases
        run: ./scripts/security-tests.sh http://localhost:18081

      - name: Summarize security test results
        id: summarize
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s security-tests-results.json ]; then
            echo "::error::security-tests-results.json was not produced"
            exit 1
          fi
          FAILS=$(jq -r '.summary.fail' security-tests-results.json)
          PASSES=$(jq -r '.summary.pass' security-tests-results.json)
          ERRORS=$(jq -r '.summary.error' security-tests-results.json)
          REG=$(jq -r --slurpfile b security-tests-baseline.json \
            '[.results[] | select(.status=="fail") | .id as $id
              | select(($b[0].known_failing | has($id)) | not) | $id] | length' \
            security-tests-results.json)

          echo "security_test_failures=$FAILS"    >> "$GITHUB_OUTPUT"
          echo "security_test_regressions=$REG"   >> "$GITHUB_OUTPUT"

          {
            echo "### Application security test cases"
            echo ""
            echo "Passed: **$PASSES**  Failed: **$FAILS**  Errored: **$ERRORS**  Regressions: **$REG**"
            echo ""
            echo "| ID | Finding | Test | WSTG | Severity | Status |"
            echo "|---|---|---|---|---|---|"
            jq -r '.results[] | "| \(.id) | \(.finding) | \(.title) | \(.wstg) | \(.severity) | \(.status) |"' \
              security-tests-results.json
            echo ""
            echo "Failures listed in \`security-tests-baseline.json\` are known unpatched findings, not regressions. See \`SECURITY_TEST_CASES.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-reports
          path: |
            security-tests-results.json
            security-tests-baseline.json
          if-no-files-found: error

      - name: Tear down test instance
        if: always()
        run: |
          docker logs "$SECTEST_CONTAINER" > sectest-container.log 2>&1 || true
          docker rm -f "$SECTEST_CONTAINER" || true
          docker network rm "$SECTEST_NETWORK" || true

  # ---------------------------------------------------------------------------
  # 5. Delta security gate
  # ---------------------------------------------------------------------------
  # Compares this run's counts against security-baseline.json and fails if any
  # of them got worse. This is the job that makes a security regression block a
  # merge, so it is one of the required status checks on master.
  #
  # Delta gating, not absolute gating. The codebase has 65 HIGH/CRITICAL image
  # CVEs and 25 npm audit findings today, none of which a single pull request
  # can clear. An absolute gate would be red on every run forever, and a check
  # that can never pass gets bypassed, disabled, or merged around, which leaves
  # less protection than having no gate at all. Blocking only on "worse than
  # before" is a standard that can actually be enforced.
  #
  # Every check prints its observed and allowed value whether it passes or
  # fails, so the evidence is in the log rather than only in a red X.
  security-gate:
    name: Security Gate
    runs-on: self-hosted
    needs: [ static-analysis, dependency-scan, security-tests ]
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate findings against the committed baseline
        run: |
          set -euo pipefail
          BASELINE=security-baseline.json
          test -s "$BASELINE" || { echo "::error::$BASELINE is missing"; exit 1; }

          # Observed values come from the upstream jobs' outputs.
          declare -A OBSERVED=(
            [gitleaks]="${{ needs.static-analysis.outputs.gitleaks_findings || 0 }}"
            [npm_audit_critical]="${{ needs.dependency-scan.outputs.npm_critical || 0 }}"
            [npm_audit_high]="${{ needs.dependency-scan.outputs.npm_high || 0 }}"
            [trivy_image_high_critical]="${{ needs.dependency-scan.outputs.image_highcrit || 0 }}"
            [security_test_regressions]="${{ needs.security-tests.outputs.security_test_regressions || 0 }}"
          )

          FAILED=0
          {
            echo "### Security gate"
            echo ""
            echo "Delta gate: a check fails only when the observed count exceeds the committed baseline."
            echo ""
            echo "| Check | Observed | Allowed | Result |"
            echo "|---|---:|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Security gate: comparing this run against $BASELINE"
          echo ""
          printf '%-28s %10s %10s   %s\n' "CHECK" "OBSERVED" "ALLOWED" "RESULT"

          for KEY in gitleaks npm_audit_critical npm_audit_high trivy_image_high_critical security_test_regressions; do
            ALLOWED=$(jq -r --arg k "$KEY" '.[$k]' "$BASELINE")
            if [ "$ALLOWED" = "null" ]; then
              echo "::error::$BASELINE has no entry for '$KEY'"
              exit 1
            fi
            OBS="${OBSERVED[$KEY]}"
            if [ "$OBS" -gt "$ALLOWED" ]; then
              RESULT="FAIL"
              FAILED=1
              echo "::error::$KEY increased: observed $OBS, baseline allows $ALLOWED"
            else
              RESULT="OK"
            fi
            printf '%-28s %10s %10s   %s\n' "$KEY" "$OBS" "$ALLOWED" "$RESULT"
            echo "| \`$KEY\` | $OBS | $ALLOWED | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "Security gate FAILED: at least one measure is worse than the committed baseline."
            {
              echo ""
              echo "**Gate failed.** One or more measures are worse than \`security-baseline.json\`."
              echo "Fix the regression, or, if the increase is justified and accepted, raise the"
              echo "number in \`security-baseline.json\` in this pull request so the change is reviewed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Security gate passed: nothing got worse."
          {
            echo ""
            echo "**Gate passed.** No measure exceeded its baseline."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6. Developer notification
  # ---------------------------------------------------------------------------
  notify:
    name: Developer Notification
    runs-on: self-hosted
    needs: [ static-analysis, dependency-scan, dast-api-tests, security-tests ]
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate findings
        id: totals
        run: |
          set -euo pipefail
          SEMGREP="${{ needs.static-analysis.outputs.semgrep_findings || 0 }}"
          ESLINT="${{ needs.static-analysis.outputs.eslint_findings || 0 }}"
          GITLEAKS="${{ needs.static-analysis.outputs.gitleaks_findings || 0 }}"
          NPM_CRIT="${{ needs.dependency-scan.outputs.npm_critical || 0 }}"
          NPM_HIGH="${{ needs.dependency-scan.outputs.npm_high || 0 }}"
          IMG="${{ needs.dependency-scan.outputs.image_highcrit || 0 }}"
          ZAP="${{ needs.dast-api-tests.outputs.zap_alerts || 0 }}"
          SECTEST="${{ needs.security-tests.outputs.security_test_failures || 0 }}"
          SECTEST_REG="${{ needs.security-tests.outputs.security_test_regressions || 0 }}"

          TOTAL=$((SEMGREP + ESLINT + GITLEAKS + NPM_CRIT + NPM_HIGH + IMG + ZAP + SECTEST))
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          {
            echo "semgrep=$SEMGREP"
            echo "eslint=$ESLINT"
            echo "gitleaks=$GITLEAKS"
            echo "npm_crit=$NPM_CRIT"
            echo "npm_high=$NPM_HIGH"
            echo "image=$IMG"
            echo "zap=$ZAP"
            echo "sectest=$SECTEST"
            echo "sectest_reg=$SECTEST_REG"
          } >> "$GITHUB_OUTPUT"

          echo "Total findings across all stages: $TOTAL"

      # The issue body deliberately contains more than three Markdown headings.
      # The repository inherits upstream's close_blank_issues.yaml, which closes
      # any issue with fewer than three headings; the previous single-line body
      # meant every automated notification was auto-closed within seconds.
      - name: Open GitHub Issue
        if: steps.totals.outputs.total != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            const t = ${{ toJSON(steps.totals.outputs) }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Summary',
              '',
              `Automated DevSecOps pipeline run **#${context.runNumber}** reported **${t.total}** finding(s) on commit \`${context.sha.substring(0,7)}\`.`,
              '',
              '## Findings by stage',
              '',
              '| Stage | Tool | Findings |',
              '|---|---|---:|',
              `| SAST | Semgrep | ${t.semgrep} |`,
              `| SAST | ESLint (security) | ${t.eslint} |`,
              `| SAST | Gitleaks | ${t.gitleaks} |`,
              `| SCA | npm audit (critical) | ${t.npm_crit} |`,
              `| SCA | npm audit (high) | ${t.npm_high} |`,
              `| SCA | Trivy image (HIGH+CRITICAL) | ${t.image} |`,
              `| DAST | OWASP ZAP baseline | ${t.zap} |`,
              `| Security test cases | Application-specific regression tests | ${t.sectest} |`,
              '',
              `Security test regressions (failures not covered by the committed baseline): **${t.sectest_reg}**.`,
              'Baseline failures are known unpatched findings documented in `SECURITY_TEST_CASES.md`.',
              '',
              '## Evidence',
              '',
              `Full logs and downloadable reports: ${runUrl}`,
              '',
              'Artifacts: `sast-reports`, `sca-reports`, `dast-reports`, `security-test-reports`.',
              '',
              '## Triage guidance',
              '',
              'CRITICAL/HIGH should be actioned same day. See `MAINTENANCE.md` section 3 for how to read each report format.'
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security pipeline findings - run #${context.runNumber}`,
              body,
              labels: ['security', 'automated']
            });
            core.info(`Created issue #${issue.data.number}`);
            core.summary.addLink('Notification issue', issue.data.html_url);
            await core.summary.write();

      - name: Report clean run
        if: steps.totals.outputs.total == '0'
        run: echo "No findings across any stage. No notification issue opened."

  # ---------------------------------------------------------------------------
  # 7. Automated secure deployment (Part 2)
  # ---------------------------------------------------------------------------
  # Failures are no longer swallowed by `|| echo`. If Ansible or the validation
  # script fails, this job fails, because a passing deploy job that deployed
  # nothing is worse than no deploy job at all.
  #
  # This also depends on security-tests and security-gate, so a security
  # regression blocks the deployment rather than merely being reported after it.
  # The gate is delta based and passes at the current baseline, so adding it
  # here does not stop the deployment from running on an unchanged codebase.
  deploy:
    name: Automated Secure Deployment
    runs-on: self-hosted
    needs: [ static-analysis, dependency-scan, dast-api-tests, security-tests, security-gate ]
    if: success() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment prerequisites
        run: |
          set -euo pipefail
          command -v ansible-playbook
          test -f ansible/inventory.ini
          test -f ansible/deploy.yml
          test -f docker/docker-compose.hardened.yml
          test -f docker/Caddyfile
          test -f scripts/post-deploy-validate.sh

      - name: Deploy via Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/deploy.yml

      - name: Post-deployment validation
        run: |
          set -euo pipefail
          chmod +x scripts/post-deploy-validate.sh
          ./scripts/post-deploy-validate.sh | tee post-deploy-validation.log

      - name: Upload deployment validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-validation
          path: |
            post-deploy-validation.log
            trivy-post-deploy.txt
            nmap-post-deploy.txt
          if-no-files-found: warn
