---
# Automated secure deployment of Audiobookshelf (Project Part 2)
#
# Changed from the previous version: the `vars_files: [secrets.yml]` declaration
# was removed. That file was never committed, so the playbook aborted before its
# first task on every pipeline run, and the workflow's `|| echo "Ansible not
# configured"` fallback converted the abort into a passing step. No variable in
# this playbook was ever sourced from it.
#
# If secrets are needed later, create ansible/secrets.yml with
# `ansible-vault create`, commit the encrypted file, and re-add vars_files.

- name: Automated secure deployment of Audiobookshelf
  hosts: local
  become: true

  vars:
    deploy_dir: /opt/abs-hardened
    data_root: /home/ubuntu/abs-hardened-data
    app_container: abs-hardened
    proxy_container: abs-caddy

  tasks:
    - name: Ensure required OS packages are present
      apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Create deployment directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0750"

    - name: Copy hardened compose file
      copy:
        src: ../docker/docker-compose.hardened.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Copy Caddy config (HTTPS + secure headers)
      copy:
        src: ../docker/Caddyfile
        dest: "{{ deploy_dir }}/Caddyfile"
        mode: "0640"

    - name: Ensure data directories exist with correct ownership
      file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"
      loop:
        - "{{ data_root }}/config"
        - "{{ data_root }}/metadata"
        - "{{ data_root }}/audiobooks"
        - "{{ data_root }}/podcasts"

    - name: Pull pinned images
      command: docker compose -f {{ deploy_dir }}/docker-compose.yml pull
      register: pull_result
      changed_when: "'Pulled' in pull_result.stderr or 'Downloaded' in pull_result.stderr"

    - name: Deploy hardened stack
      command: docker compose -f {{ deploy_dir }}/docker-compose.yml up -d
      register: up_result
      changed_when: "'Started' in up_result.stderr or 'Created' in up_result.stderr"

    - name: Wait for application healthcheck to pass
      shell: |
        {% raw %}docker inspect --format '{{ .State.Health.Status }}'{% endraw %} {{ app_container }}
      register: health
      until: health.stdout | trim == "healthy"
      retries: 20
      delay: 5
      changed_when: false

    - name: Confirm reverse proxy is running
      shell: |
        {% raw %}docker inspect --format '{{ .State.Running }}'{% endraw %} {{ proxy_container }}
      register: proxy_state
      failed_when: proxy_state.stdout | trim != "true"
      changed_when: false

    - name: Verify network access controls (only expected ports exposed)
      command: docker port {{ proxy_container }}
      register: ports_out
      changed_when: false

    - name: Confirm the application container publishes no host ports directly
      command: docker port {{ app_container }}
      register: app_ports
      failed_when: app_ports.stdout | trim | length > 0
      changed_when: false

    - name: Show exposed ports (audit trail / screenshot evidence)
      debug:
        var: ports_out.stdout_lines
